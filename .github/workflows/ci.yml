name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint .
      - name: Unit tests (game rules, progress, rewards)
        run: npm test -- --ci
      - name: Bundle Android JS (catches import and config errors)
        run: npx expo export --platform android --output-dir dist-android
        env:
          CI: 1
          EXPO_OFFLINE: 1
